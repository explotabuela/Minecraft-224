name: Bot 224

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      comando:
        description: 'Comando (vacío = ronda normal). Ej: prueba | tonto | resumen | unir Pepe .Pepe | temporada | mantenimiento'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: bot224
  cancel-in-progress: false

jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: America/Mazatlan
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: bot

      - name: Bajar datos del bot
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --branch bot-datos --depth 1 "$URL" datos; then
            echo "Datos cargados"
          else
            mkdir datos && cd datos
            git init -b bot-datos
            git remote add origin "$URL"
            cp -r ../repo/bot/datos-inicial/. . 2>/dev/null || true
            echo "Primera vez: datos nuevos"
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar
        run: dotnet build repo/bot/src -c Release -o bin

      - name: Ronda
        working-directory: datos
        env:
          BOT_CONFIG: ${{ secrets.BOT_CONFIG }}
          M224_COMANDO: ${{ github.event.inputs.comando }}
        run: |
          printf '%s' "$BOT_CONFIG" > config.json
          dotnet ../bin/Bot224.dll --una-vez
          rm -f config.json

      - name: Guardar datos
        if: always()
        working-directory: datos
        run: |
          rm -f config.json
          printf 'config.json\n' > .gitignore
          git config user.name "Bot 224"
          git config user.email "bot224@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Ronda $(date '+%Y-%m-%d %H:%M')"
          git push -q origin bot-datos
